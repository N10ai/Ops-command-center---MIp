<head>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    body {
      background: #0b1220;
    }

    .glass {
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
    }

    .tab-btn {
      padding: 8px 12px;
      border-radius: 10px;
      background: rgba(255,255,255,0.06);
      color: #d1d5db;
      font-size: 14px;
    }

    .tab-btn.active {
      background: rgba(59,130,246,0.18);
      color: #60a5fa;
    }

    .field-label {
      font-size: 12px;
      color: #9ca3af;
      margin-bottom: 4px;
      display: block;
    }

    .field-input {
      width: 100%;
      padding: 8px 10px;
      border-radius: 10px;
      background: white;
      color: #111827;
      font-size: 14px;
      border: 1px solid #d1d5db;
    }

    .preset-btn {
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(255,255,255,0.06);
      color: white;
      font-size: 13px;
      text-align: left;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .preset-btn:hover {
      background: rgba(59,130,246,0.15);
    }

    .charge-row input {
      min-width: 0;
    }

.pdf-mode {
  background: white !important;
}

.pdf-mode table {
  max-width: 7.5in !important;
  margin: auto !important;
}

@page {
  size: Letter;
  margin: 0.5in;
}

    .pdf-mode tr {
  page-break-inside: avoid;
}

@media print {

  body * {
    visibility: hidden;
  }

  #pdfTemplate, #pdfTemplate * {
    visibility: visible;
  }

  #pdfTemplate {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
  }

  .pdf-page {
    width: 8.5in;
    min-height: 11in;
    padding: 0.6in;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
    color: #111;
    position: relative;
  }

  /* HEADER */
  .pdf-header {
    position: fixed;
    top: 0.4in;
    left: 0.6in;
    right: 0.6in;
    text-align: center;
  }

  .pdf-title {
    font-size: 18px;
    font-weight: 700;
    margin-top: 6px;
    color: #0077c8;
  }

  /* BODY */
  .pdf-body {
    margin-top: 1.4in;
    margin-bottom: 1.8in;
  }

  /* FOOTER */
  .pdf-footer {
    position: fixed;
    bottom: 0.4in;
    left: 0.6in;
    right: 0.6in;
    font-size: 11px;
    color: #555;
  }

  .footer-inner {
    text-align: center;
  }

  .footer-line {
    height: 1px;
    background: #ddd;
    margin: 10px 0;
  }

  .footer-address {
    margin-top: 4px;
    font-size: 10px;
    color: #777;
  }

  .footer-logo {
    margin-top: 6px;
  }

  .page-number::after {
    content: counter(page);
  }

  /* TABLE FIXES */
  table {
    page-break-inside: avoid;
  }

  tr {
    page-break-inside: avoid;
  }

  @page {
    size: Letter;
    margin: 0;
  }
}

    
  </style>
</head>

function addPresetByIndex(index) {
  const preset = presets[index];

  let newCharge;

  if (preset.type === "flat") {
    newCharge = {
      name: preset.name,
      description: preset.description || "",
      type: "fixed",
      amount: preset.amount || 0
    };
  } else {
    newCharge = {
      name: preset.name,
      description: preset.description || "",
      type: "freight",
      basis: preset.basis || "weight",
      unit: preset.unit || "kg",
      rate: preset.rate || 0,
      min: preset.min || 0
    };
  }

  charges.push(newCharge);
  renderTab();
  renderPreview();
}
    

function addEmptyCharge() {
  charges.push({
    name: "New Charge",
    description: "",
    type: "fixed",
    amount: 0
  });
  renderTab();
  renderPreview();
}

    function updateCharge(index, field, value) {

    function extractNumericAmount(text) {
      const matches = String(text || "").match(/-?\d+(\.\d+)?/g);
      if (!matches || matches.length === 0) return 0;
      return Number(matches[0]) || 0;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    renderTab();
    renderPreview();


function addStop() {
  route.push({ code: "", name: "" });
  renderTab();
  renderPreview();
}

function updateRoute(i, field, value) {
  route[i][field] = value;
  renderPreview();
}

function removeStop(i) {
  route.splice(i, 1);
  renderTab();
  renderPreview();
}


function updateCargo(field, value) {
  cargo[field] = Number(value) || 0;

  // 🔥 auto-calculate
  cargo.chargeableWeight = Math.max(
    cargo.grossWeight,
    cargo.volumetricWeight
  );

  renderPreview();
}
    
function updateUnit(newUnit) {

  if (cargo.unit === newUnit) return;

  // 🔥 convert values
  if (newUnit === "kg") {
    cargo.grossWeight = cargo.grossWeight * 0.453592;
    cargo.volumetricWeight = cargo.volumetricWeight * 0.453592;
  } else {
    cargo.grossWeight = cargo.grossWeight * 2.20462;
    cargo.volumetricWeight = cargo.volumetricWeight * 2.20462;
  }

  cargo.unit = newUnit;

  updateCargo("grossWeight", cargo.grossWeight); // recalculates
}


    function calculateFreight(charge) {

  let weight = cargo.chargeableWeight;

  // 🔥 convert if units mismatch
  if (cargo.unit !== charge.unit) {
    if (charge.unit === "kg") {
      weight = weight * 0.453592;
    } else {
      weight = weight * 2.20462;
    }
  }

  const value = weight * charge.rate;

  return Math.max(value, charge.min || 0);
}


function calculateTotal() {
  return charges.reduce((sum, c) => {

    if (c.type === "freight") {
      return sum + calculateFreight(c);
    }

    if (c.type === "fixed") {
      return sum + (c.amount || 0);
    }

    return sum;

  }, 0);
}

function formatCharge(charge) {
  if (charge.type === "freight") {
    const total = calculateFreight(charge);

    const unitLabel = charge.unit || cargo.unit;
    const minText = charge.min ? ` (Min $${charge.min})` : "";

    return `$${Number(charge.rate || 0).toFixed(2)} / ${unitLabel}${minText} → $${total.toFixed(2)}`;
  }

  if (charge.type === "fixed") {
    return `$${Number(charge.amount || 0).toFixed(2)}`;
  }

  return "-";
}


    
    function savePreset() {
  const name = document.getElementById("presetName").value.trim();
  const description = document.getElementById("presetDesc").value.trim();
  const type = document.getElementById("presetType").value;
  const rateOrAmount = Number(document.getElementById("presetRate").value) || 0;
  const min = Number(document.getElementById("presetMin").value) || 0;

  if (!name) return;

  let preset = {
    name,
    description
  };

  if (type === "flat") {
    preset.type = "flat";
    preset.basis = "fixed";
    preset.unit = null;
    preset.rate = null;
    preset.min = null;
    preset.amount = rateOrAmount;
  } else if (type === "per_kg") {
    preset.type = "variable";
    preset.basis = "weight";
    preset.unit = "kg";
    preset.rate = rateOrAmount;
    preset.min = min;
    preset.amount = null;
  } else if (type === "per_lb") {
    preset.type = "variable";
    preset.basis = "weight";
    preset.unit = "lb";
    preset.rate = rateOrAmount;
    preset.min = min;
    preset.amount = null;
  } else if (type === "per_cbm") {
    preset.type = "variable";
    preset.basis = "volume";
    preset.unit = "cbm";
    preset.rate = rateOrAmount;
    preset.min = min;
    preset.amount = null;
  } else if (type === "per_piece") {
    preset.type = "variable";
    preset.basis = "piece";
    preset.unit = "unit";
    preset.rate = rateOrAmount;
    preset.min = min;
    preset.amount = null;
  } else {
    preset.type = "flat";
    preset.basis = "fixed";
    preset.unit = null;
    preset.rate = null;
    preset.min = null;
    preset.amount = rateOrAmount;
  }

  presets.push(preset);
  renderTab();
}


    

    function changeChargeType(index, newType) {
  if (newType === "fixed") {
    charges[index].type = "fixed";
    charges[index].amount = charges[index].amount ?? 0;
    delete charges[index].rate;
    delete charges[index].min;
    delete charges[index].unit;
  } else {
    charges[index].type = "freight";
    charges[index].rate = charges[index].rate ?? 0;
    charges[index].min = charges[index].min ?? 0;
    charges[index].unit = charges[index].unit ?? "kg";
    delete charges[index].amount;
  }

  renderTab();
  renderPreview();
}

function updateChargeValue(index, value) {
  const numericValue = Number(value) || 0;

  if (charges[index].type === "fixed") {
    charges[index].amount = numericValue;
  } else {
    charges[index].rate = numericValue;
  }

  renderPreview();
}


function generatePDF() {

  const element = document.getElementById("quotePreview");

  // 🔥 clone so we don’t break UI
  const clone = element.cloneNode(true);

  // 🔥 force PDF mode
  clone.classList.add("pdf-mode");

  // 🔥 create temp container
  const wrapper = document.createElement("div");
  wrapper.style.padding = "20px";
  wrapper.style.background = "white";
  wrapper.appendChild(clone);

  document.body.appendChild(wrapper);

  html2pdf().set({
    margin: 0,
    filename: `${quoteData.quoteNumber}.pdf`,
    image: { type: 'jpeg', quality: 1 },
    html2canvas: {
      scale: 2,
      useCORS: true
    },
    jsPDF: {
      unit: 'in',
      format: 'letter',
      orientation: 'portrait'
    }
  }).from(wrapper).save().then(() => {
    document.body.removeChild(wrapper);
  });

}
