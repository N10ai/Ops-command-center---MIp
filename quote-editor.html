<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MIP Quote Editor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: #0b1220;
    }

    .glass {
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
    }

    .tab-btn {
      padding: 8px 12px;
      border-radius: 10px;
      background: rgba(255,255,255,0.06);
      color: #d1d5db;
      font-size: 14px;
    }

    .tab-btn.active {
      background: rgba(59,130,246,0.18);
      color: #60a5fa;
    }

    .field-label {
      font-size: 12px;
      color: #9ca3af;
      margin-bottom: 4px;
      display: block;
    }

    .field-input {
      width: 100%;
      padding: 8px 10px;
      border-radius: 10px;
      background: white;
      color: #111827;
      font-size: 14px;
      border: 1px solid #d1d5db;
    }

    .preset-btn {
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(255,255,255,0.06);
      color: white;
      font-size: 13px;
      text-align: left;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .preset-btn:hover {
      background: rgba(59,130,246,0.15);
    }

    .charge-row input {
      min-width: 0;
    }
  </style>
</head>
<body class="text-white min-h-screen">

  <div class="flex h-screen overflow-hidden">

        <h1 class="text-xl font-semibold">Quote Builder</h1>
        <button
          onclick="resetQuote()"

          Reset

      <div class="flex gap-2 mb-4">

        <button id="tab-charges-btn" class="tab-btn" onclick="setTab('charges')">Charges</button>
        <button id="tab-notes-btn" class="tab-btn" onclick="setTab('notes')">Notes</button>

      <div id="tabContent"></div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="flex-1 overflow-y-auto p-4 md:p-8">

        <h2 class="text-lg font-medium text-gray-200">Live Preview</h2>
      </div>

      <div class="bg-[#e5e7eb] rounded-2xl p-4 md:p-8">

      </div>
    </div>

  </div>

</div>
        `;
      }

      if (currentTab === "charges") {
        container.innerHTML = `

            <div class="grid grid-cols-2 gap-2">
              <button class="preset-btn" onclick="addPreset('A/F General', '$0.00 x Kg (Min $0.00)')">A/F General</button>
              <button class="preset-btn" onclick="addPreset('A/F Hazmat', '$0.00 x Kg (Min $0.00) + $0.00 UN fee')">A/F Hazmat</button>
              <button class="preset-btn" onclick="addPreset('AWB', '$50.00')">AWB</button>
              <button class="preset-btn" onclick="addPreset('AES', '$25.00')">AES</button>
              <button class="preset-btn" onclick="addPreset('Handling', '$65.00')">Handling</button>
              <button class="preset-btn" onclick="addPreset('A/T General', '$0.08 x Kgs (Min $65)')">A/T General</button>
              <button class="preset-btn" onclick="addPreset('A/T Hazmat', '$0.10 x Kgs (Min $85) + $50 fee')">A/T Hazmat</button>

          <div class="flex items-center justify-between mb-3">

            <button onclick="addEmptyCharge()" class="text-xs px-3 py-2 rounded-lg bg-blue-500/20 text-blue-300 border border-blue-400/20">
              + Add Custom

          </div>

          <div class="space-y-2">
            ${charges.map((charge, index) => `
              <div class="charge-row grid grid-cols-[1fr_1fr_auto] gap-2 items-center">             
                <input
  class="field-input"

  onchange="updateCharge(${index}, 'name', this.value)">

      }

      if (currentTab === "notes") {
        container.innerHTML = `
          <div class="space-y-4">
            <div>
              <label class="field-label">Intro Text</label>
              <textarea class="field-input min-h-[100px]" onchange="updateQuoteField('introText', this.value)">${escapeHtml(quoteData.introText || "Hola Customer,\\n\\nTe adjunto la cotización abajo:")}</textarea>

            <div>
              <label class="field-label">Internal / Footer Notes</label>
              <textarea class="field-input min-h-[120px]" onchange="updateQuoteField('notes', this.value)">${escapeHtml(quoteData.notes)}</textarea>
            </div>
          </div>
        `;
      }
    }

    function updateQuoteField(field, value) {
      quoteData[field] = value;
      renderPreview();
    }

    function addPreset(name, amountText) {
      charges.push({ name, amountText });
      renderTab();
      renderPreview();
    }

    function addEmptyCharge() {
      charges.push({ name: "New Charge", amountText: "$0.00" });
      renderTab();
      renderPreview();
    }

    function updateCharge(index, field, value) {
      charges[index][field] = value;
      renderPreview();
    }

    function removeCharge(index) {
      charges.splice(index, 1);
      renderTab();
      renderPreview();
    }

    function resetQuote() {
      location.reload();
    }

    function extractNumericAmount(text) {
      const matches = String(text || "").match(/-?\d+(\.\d+)?/g);
      if (!matches || matches.length === 0) return 0;
      return Number(matches[0]) || 0;
    }

    function formatMoney(value) {
      return `$${Number(value).toFixed(2)}`;
    }

    function renderPreview() {
const total = calculateTotal();
      

      const intro = (quoteData.introText || "Hola Customer,Te adjunto la cotización abajo:")

                    ${escapeHtml(quoteData.quoteTitle)}
                  </td>
                </tr>

         <td style="font-size:14px;color:#444;padding:15px 20px 25px 20px; line-height:1.5;">
                    ${intro.replace("Customer", escapeHtml(quoteData.customerName))}
                  </td>
                </tr>

                <tr>
  <td style="padding-bottom:10px;">
    <table width="100%" style="text-align:center;">
      <tr>
        ${route.map((r, i) => `
          <td style="font-size:18px;font-weight:700;color:#222;">
            ${r.code}
          </td>
          ${i < route.length - 1 ? `
            <td style="font-size:18px;color:#0077c8;width:30px;">
              →
            </td>
          ` : ""}
        `).join("")}
      </tr>

      <tr>
        ${route.map((r, i) => `
          <td style="font-size:12px;color:#777;">
            ${r.name}
          </td>
          ${i < route.length - 1 ? `<td></td>` : ""}
        `).join("")}
      </tr>
    </table>
  </td>
</tr>


      

           

                <tr>
                  <td>
                    <table width="100%" cellpadding="10" cellspacing="0" style="border:1px solid #e4e4e4;border-radius:6px;background:#f9fafb;table-layout:fixed;">
                      <tr>
                        <td style="width:50%;font-size:13px;color:#555;"><strong>Quote #</strong></td>
                        <td style="width:50%;text-align:right;font-weight:700;">${escapeHtml(quoteData.quoteNumber)}</td>
                      </tr>
                      <tr>
                        <td style="width:50%;font-size:13px;color:#555;"><strong>Reference #</strong></td>
                        <td style="width:50%;text-align:right;font-weight:700;">${escapeHtml(quoteData.referenceNumber)}</td>
                      </tr>
                      <tr>
                        <td style="width:50%;font-size:13px;color:#555;"><strong>Validity</strong></td>
                        <td style="width:50%;text-align:right;font-weight:700;white-space:nowrap;">${escapeHtml(quoteData.validity)}</td>
                      </tr>
                      <tr>

                        <td style="width:50%;text-align:right;font-weight:700;">${escapeHtml(quoteData.airline)}</td>
                      </tr>
                      <tr>
                        <td style="width:50%;font-size:13px;color:#555;"><strong>Transit</strong></td>
                        <td style="width:50%;text-align:right;font-weight:700;">${escapeHtml(quoteData.transit)}</td>
                      </tr>
                      <tr>
                        <td style="width:50%;font-size:13px;color:#555;"><strong>Frequency</strong></td>
                        <td style="width:50%;text-align:right;font-weight:700;">${escapeHtml(quoteData.frequency)}</td>
                      </tr>
                    </table>
                  </td>
                </tr>

                <tr>
                  <td style="padding-top:20px;">
                    <table width="100%" cellpadding="10" cellspacing="0" style="border:1px solid #e4e4e4;border-radius:6px;background:#ffffff;table-layout:fixed;">
                     ${charges.map((charge, index) => `
  <tr>
    <td><strong>${escapeHtml(charge.name)}</strong></td>
    <td align="right">${formatCharge(charge)}</td>
  </tr>

  ${index === 1 ? `

`).join("")}

                <tr>

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    renderTab();
    renderPreview();


function addStop() {
  route.push({ code: "", name: "" });
  renderTab();
  renderPreview();
}

function updateRoute(i, field, value) {
  route[i][field] = value;
  renderPreview();
}

function removeStop(i) {
  route.splice(i, 1);
  renderTab();
  renderPreview();
}


function updateCargo(field, value) {
  cargo[field] = Number(value) || 0;

  // 🔥 auto-calculate
  cargo.chargeableWeight = Math.max(
    cargo.grossWeight,
    cargo.volumetricWeight
  );

  renderPreview();
}
    
function updateUnit(newUnit) {

  if (cargo.unit === newUnit) return;

  // 🔥 convert values
  if (newUnit === "kg") {
    cargo.grossWeight = cargo.grossWeight * 0.453592;
    cargo.volumetricWeight = cargo.volumetricWeight * 0.453592;
  } else {
    cargo.grossWeight = cargo.grossWeight * 2.20462;
    cargo.volumetricWeight = cargo.volumetricWeight * 2.20462;
  }

  cargo.unit = newUnit;

  updateCargo("grossWeight", cargo.grossWeight); // recalculates
}


    function calculateFreight(charge) {

  let weight = cargo.chargeableWeight;

  // 🔥 convert if units mismatch
  if (cargo.unit !== charge.unit) {
    if (charge.unit === "kg") {
      weight = weight * 0.453592;
    } else {
      weight = weight * 2.20462;
    }
  }

  const value = weight * charge.rate;

  return Math.max(value, charge.min || 0);
}


function calculateTotal() {
  return charges.reduce((sum, c) => {

    if (c.type === "freight") {
      return sum + calculateFreight(c);
    }

    if (c.type === "fixed") {
      return sum + (c.amount || 0);
    }

    return sum;

  }, 0);
}

function formatCharge(charge) {

  if (charge.type === "freight") {
    const total = calculateFreight(charge);
    return `$${charge.rate} x ${cargo.unit} (Min $${charge.min}) → $${total.toFixed(2)}`;
  }

  if (charge.type === "fixed") {
    return `$${charge.amount}`;
  }

  return "-";
}
    
  </script>
