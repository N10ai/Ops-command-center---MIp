<!DOCTYPE html>
<html>
<head>
  <title>Quote Editor</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-white p-6">

<h1 class="text-xl mb-4">Quote Editor</h1>

<div id="quoteInfo" class="mb-6"></div>

<!-- CHARGES -->
<div>
  <h2 class="mb-2">Charges</h2>

  <div id="chargesList" class="space-y-2"></div>

  <button onclick="addCharge()" class="mt-3 bg-blue-500 px-3 py-1 rounded">
    + Add Charge
  </button>
</div>

<!-- SAVE -->
<button onclick="saveQuote()" class="mt-6 bg-green-500 px-4 py-2 rounded">
  Save
</button>

<script>
const urlParams = new URLSearchParams(window.location.search);
const quoteNumber = urlParams.get("quote");

let quoteData = {};
let charges = [];

async function loadQuote() {
  const res = await fetch(`https://n8n-n10ai.onrender.com/webhook/get-single-quote?quote=${quoteNumber}`);
  const data = await res.json();

  quoteData = data;
  charges = data.charges || [];

  render();
}

function render() {
  document.getElementById("quoteInfo").innerHTML = `
    <div>Quote: ${quoteData.quoteNumber}</div>
    <div>${quoteData.origin} → ${quoteData.destination}</div>
  `;

  renderCharges();
}

function renderCharges() {
  const container = document.getElementById("chargesList");
  container.innerHTML = "";

  charges.forEach((c, i) => {
    container.innerHTML += `
      <div class="flex gap-2">
        <input value="${c.name}" onchange="updateCharge(${i}, 'name', this.value)" class="text-black px-1" />
        <input value="${c.amount}" onchange="updateCharge(${i}, 'amount', this.value)" class="text-black px-1 w-20" />
        <button onclick="removeCharge(${i})" class="text-red-400">X</button>
      </div>
    `;
  });
}

function addCharge() {
  charges.push({ name: "New Charge", amount: 0 });
  renderCharges();
}

function updateCharge(i, field, value) {
  charges[i][field] = value;
}

function removeCharge(i) {
  charges.splice(i, 1);
  renderCharges();
}

async function saveQuote() {
  await fetch("https://n8n-n10ai.onrender.com/webhook/update-quote-full", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      quoteNumber,
      charges
    })
  });

  alert("Saved!");
}

loadQuote();
</script>

</body>
</html>
