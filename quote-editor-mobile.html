<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MIP Mobile Quote</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
  background: radial-gradient(circle at top, #0b1220, #05070d);
  color: #e5e7eb;
}
.glass {
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px;
}
input {
  background: transparent;
  outline: none;
  width: 100%;
}
</style>
</head>

<body class="pb-32">

<!-- HEADER -->
<div class="sticky top-0 z-50 glass p-4 flex justify-between items-center">
  <div>
    <div class="text-xs text-gray-400">Quote</div>
    <div id="quoteNumber" class="font-bold text-lg"></div>
  </div>
  <button onclick="sendQuote()" class="bg-blue-600 px-4 py-2 rounded-lg text-sm">
    Send
  </button>
</div>

<div class="p-4 space-y-4">

  <!-- ROUTE -->
  <div class="glass p-4">
    <div class="text-xs text-gray-400">Route</div>
    <div id="routeCodes" class="font-semibold text-lg"></div>
    <div id="routeNames" class="text-sm text-gray-400"></div>
  </div>

  <!-- SERVICE -->
  <div class="glass p-4">
    <div class="text-xs text-gray-400">Service</div>
    <div id="service" class="font-semibold"></div>
  </div>

<div class="flex gap-2 px-4">
  <button onclick="setBase('kg')" class="glass px-3 py-1">KG</button>
  <button onclick="setBase('cbm')" class="glass px-3 py-1">CBM</button>
</div>
<div id="presetContainer" class="flex gap-2 overflow-x-auto px-4"></div>

  <!-- CHARGES -->
  <div>
    <div class="flex justify-between items-center px-1 mb-2">
      <div class="text-sm text-gray-400">Charges</div>
      <button onclick="addCharge()" class="text-blue-400 text-sm">+ Add</button>
    </div>

    <div id="chargesContainer" class="space-y-3"></div>
  </div>

  <!-- CARGO -->
  <div class="glass p-4">
    <div class="text-xs text-gray-400">Cargo</div>
    <div id="cargoSummary" class="text-sm mt-2"></div>
  </div>

</div>

<!-- TOTAL BAR -->
<div class="fixed bottom-0 left-0 right-0 glass p-4 flex justify-between items-center">

  <div>
    <div class="text-xs text-gray-400">Total</div>
    <div id="totalAmount" class="text-xl font-bold">$0</div>
  </div>

  <button onclick="generatePDF()" class="bg-blue-600 px-5 py-3 rounded-xl font-semibold">
    PDF
  </button>

</div>

<script>

// ==========================
// STATE
// ==========================
let quote = {
  mode: "air",

  baseType: "kg", // kg | cbm

  totals: {
    chargeableWeightKg: 600,
    volumeCBM: 3.2
  },

  quoteNumber: "MIP-174402",
  originCode: "MIA",
  destinationCode: "UIO",

  charges: []
};

// ==========================
// PRESETS (LIKE DESKTOP)
// ==========================
const presets = [
  { name: "A/F General", type: "per_kg", rate: 0.08 },
  { name: "A/F Hazmat", type: "per_kg", rate: 0.12 },
  { name: "Ocean Freight", type: "per_cbm", rate: 45 },
  { name: "AWB Fee", type: "flat", amount: 50 },
  { name: "Handling", type: "flat", amount: 35 }
];

// ==========================
// BASE SELECTOR
// ==========================
function setBase(type) {
  quote.baseType = type;
  refresh();
}

// ==========================
// GET BASE
// ==========================
function getBaseValue(charge) {

  if (charge.type === "per_kg") return quote.totals.chargeableWeightKg;
  if (charge.type === "per_cbm") return quote.totals.volumeCBM;

  return 0;
}

// ==========================
// CALCULATE
// ==========================
function calculateCharge(c) {
  if (c.type === "flat") return c.amount || 0;
  return (c.rate || 0) * getBaseValue(c);
}

// ==========================
// RENDER
// ==========================
function renderCharges() {

  const container = document.getElementById("chargesContainer");
  container.innerHTML = "";

  quote.charges.forEach((c, i) => {

    const amount = calculateCharge(c);

    const div = document.createElement("div");
    div.className = "glass p-3 space-y-2";

    div.innerHTML = `
      <input value="${c.name}" 
        onchange="updateField(${i}, 'name', this.value)"
        class="font-medium text-sm">

      <input value="${c.description || ''}" 
        placeholder="Description"
        onchange="updateField(${i}, 'description', this.value)"
        class="text-xs text-gray-400">

      <div class="flex gap-2">

        <select onchange="updateField(${i}, 'type', this.value)" class="bg-transparent">
          <option ${c.type==='flat'?'selected':''}>flat</option>
          <option ${c.type==='per_kg'?'selected':''}>per_kg</option>
          <option ${c.type==='per_cbm'?'selected':''}>per_cbm</option>
        </select>

        ${
          c.type === "flat"
          ? `<input type="number" value="${c.amount||0}" 
               onchange="updateField(${i}, 'amount', this.value)">`
          : `<input type="number" value="${c.rate||0}" 
               onchange="updateField(${i}, 'rate', this.value)">`
        }

        <div class="ml-auto font-bold">
          $${amount.toFixed(2)}
        </div>

      </div>
    `;

    container.appendChild(div);
  });
}

// ==========================
// UPDATE FIELD
// ==========================
function updateField(i, key, val) {
  if (key === "rate" || key === "amount") {
    quote.charges[i][key] = Number(val) || 0;
  } else {
    quote.charges[i][key] = val;
  }
  refresh();
}

// ==========================
// ADD PRESET
// ==========================
function addPreset(index) {
  quote.charges.push({...presets[index]});
  refresh();
}

// ==========================
// TOTAL
// ==========================
function calculateTotal() {
  let total = 0;
  quote.charges.forEach(c => total += calculateCharge(c));
  document.getElementById("totalAmount").innerText = "$" + total.toFixed(2);
}

// ==========================
// REFRESH
// ==========================
function refresh() {
  renderCharges();
  calculateTotal();
}

// ==========================
// PDF
// ==========================
function generatePDF() {

  const container = document.createElement("div");

  container.innerHTML = `
    <div style="font-family: Arial; padding:20px; color:#222">

      <!-- HEADER -->
      <div style="display:flex; justify-content:space-between; margin-bottom:20px">
        <div>
          <h2 style="margin:0">MIP Cargo</h2>
          <div style="font-size:12px;color:#555">Freight Quote</div>
        </div>
        <div style="text-align:right">
          <strong>Quote #${quote.quoteNumber}</strong><br>
          <span style="font-size:12px">${new Date().toLocaleDateString()}</span>
        </div>
      </div>

      <!-- ROUTE -->
      <div style="margin-bottom:15px; font-size:14px;">
        <strong>${quote.originCode} → ${quote.destinationCode}</strong>
      </div>

      <!-- TABLE -->
      <table style="width:100%; border-collapse:collapse; font-size:13px">

        <thead>
          <tr style="border-bottom:2px solid #ddd">
            <th align="left">Description</th>
            <th align="right">Amount</th>
          </tr>
        </thead>

        <tbody>
          ${quote.charges.map(c => `
            <tr style="border-bottom:1px solid #eee">
              <td style="padding:6px 0">
                ${c.name}<br>
                <span style="font-size:11px;color:#777">
                  ${c.type === "flat"
                    ? "Flat charge"
                    : `${c.rate} × ${getBaseValue(c).toFixed(2)}`
                  }
                </span>
              </td>
              <td align="right">
                $${calculateCharge(c).toFixed(2)}
              </td>
            </tr>
          `).join("")}
        </tbody>

      </table>

      <!-- TOTAL -->
      <div style="margin-top:20px; text-align:right">
        <h3>Total: ${document.getElementById("totalAmount").innerText}</h3>
      </div>

    </div>
  `;

  const opt = {
    margin: 0.3,
    filename: `Quote-${quote.quoteNumber}.pdf`,
    html2canvas: { scale: 2, useCORS: true },
    jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
  };

  html2pdf().set(opt).from(container).save();
}
// ==========================
// INIT
// ==========================
function init() {

  quote.charges = [
    {...presets[0]},
    {...presets[3]}
  ];

  loadHeaderData(); // ✅ ADD THIS
  renderPresetButtons();
  refresh();
}

// ==========================
// PRESET BUTTONS UI
// ==========================
function renderPresetButtons() {
  const container = document.getElementById("presetContainer");

  presets.forEach((p, i) => {
    const btn = document.createElement("button");
    btn.innerText = p.name;
    btn.className = "glass px-3 py-1 text-xs";
    btn.onclick = () => addPreset(i);
    container.appendChild(btn);
  });
}

init();

function loadHeaderData() {
  document.getElementById("quoteNumber").innerText = "#" + quote.quoteNumber;

  document.getElementById("routeCodes").innerText =
    `${quote.originCode} → ${quote.destinationCode}`;

  document.getElementById("routeNames").innerText =
    `From ${quote.originCode} to ${quote.destinationCode}`;

  document.getElementById("service").innerText =
    quote.mode.toUpperCase() + " FREIGHT";

  document.getElementById("cargoSummary").innerText =
    `${quote.totals.chargeableWeightKg} kg • ${quote.totals.volumeCBM} m³`;
}


</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>



</body>
</html>
