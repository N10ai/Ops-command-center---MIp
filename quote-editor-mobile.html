<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MIP Mobile Quote</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
  background: radial-gradient(circle at top, #0b1220, #05070d);
  color: #e5e7eb;
}
.glass {
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px;
}
input {
  background: transparent;
  outline: none;
  width: 100%;
}
</style>
</head>

<body class="pb-32">

<!-- HEADER -->
<div class="sticky top-0 z-50 glass p-4 flex justify-between items-center">
  <div>
    <div class="text-xs text-gray-400">Quote</div>
    <div id="quoteNumber" class="font-bold text-lg"></div>
  </div>
  <button onclick="sendQuote()" class="bg-blue-600 px-4 py-2 rounded-lg text-sm">
    Send
  </button>
</div>

<div class="p-4 space-y-4">

  <!-- ROUTE -->
  <div class="glass p-4">
    <div class="text-xs text-gray-400">Route</div>
    <div id="routeCodes" class="font-semibold text-lg"></div>
    <div id="routeNames" class="text-sm text-gray-400"></div>
  </div>

  <!-- SERVICE -->
  <div class="glass p-4">
    <div class="text-xs text-gray-400">Service</div>
    <div id="service" class="font-semibold"></div>
  </div>

  <!-- CHARGES -->
  <div>
    <div class="flex justify-between items-center px-1 mb-2">
      <div class="text-sm text-gray-400">Charges</div>
      <button onclick="addCharge()" class="text-blue-400 text-sm">+ Add</button>
    </div>

    <div id="chargesContainer" class="space-y-3"></div>
  </div>

  <!-- CARGO -->
  <div class="glass p-4">
    <div class="text-xs text-gray-400">Cargo</div>
    <div id="cargoSummary" class="text-sm mt-2"></div>
  </div>

</div>

<!-- TOTAL BAR -->
<div class="fixed bottom-0 left-0 right-0 glass p-4 flex justify-between items-center">

  <div>
    <div class="text-xs text-gray-400">Total</div>
    <div id="totalAmount" class="text-xl font-bold">$0</div>
  </div>

  <button onclick="generatePDF()" class="bg-blue-600 px-5 py-3 rounded-xl font-semibold">
    PDF
  </button>

</div>

<script>

// ==========================
// MOCK DATA (NOW WITH TOTALS)
// ==========================
let quote = {
  mode: "air", // air | ocean | ground

  totals: {
    chargeableWeightKg: 600,
    chargeableWeightLb: 1322,
    volumeCBM: 3.2,
    volumeCFT: 113
  },

  quoteNumber: "MIP-174402",
  originCode: "MIA",
  originName: "Miami, USA",
  destinationCode: "UIO",
  destinationName: "Quito, Ecuador",

  service: "Air Freight • General Cargo",
  cargo: "3 Pallets • 600 kg • 3.2 m³",

  charges: [
    { name: "A/F General", type: "per_kg", rate: 0.08 },
    { name: "AWB Fee", type: "flat", amount: 50 }
  ]
};

// ==========================
// LOAD UI
// ==========================
function loadQuote() {
  document.getElementById("quoteNumber").innerText = "#" + quote.quoteNumber;

  document.getElementById("routeCodes").innerText =
    `${quote.originCode} → ${quote.destinationCode}`;

  document.getElementById("routeNames").innerText =
    `${quote.originName} → ${quote.destinationName}`;

  document.getElementById("service").innerText = quote.service;
  document.getElementById("cargoSummary").innerText = quote.cargo;

  renderCharges();
  calculateTotal();
}

// ==========================
// DETERMINE BASE VALUE
// ==========================
function getBaseValue(type) {

  if (type === "per_kg") return quote.totals.chargeableWeightKg;
  if (type === "per_lb") return quote.totals.chargeableWeightLb;

  if (type === "per_cbm") return quote.totals.volumeCBM;
  if (type === "per_cft") return quote.totals.volumeCFT;

  return 0;
}

// ==========================
// CALCULATE CHARGE
// ==========================
function calculateCharge(charge) {

  if (charge.type === "flat") {
    return Number(charge.amount) || 0;
  }

  const base = getBaseValue(charge.type);
  const rate = Number(charge.rate) || 0;

  return base * rate;
}

// ==========================
// RENDER CHARGES
// ==========================
function renderCharges() {
  const container = document.getElementById("chargesContainer");
  container.innerHTML = "";

  quote.charges.forEach((charge, index) => {

    const amount = calculateCharge(charge);

    const div = document.createElement("div");
    div.className = "glass p-3 space-y-2";

    div.innerHTML = `
      <div class="flex justify-between items-center">

        <div>
          <div class="font-medium">${charge.name}</div>
          <div class="text-xs text-gray-400">${charge.type}</div>
        </div>

        <button onclick="removeCharge(${index})" class="text-red-400">✕</button>
      </div>

      <div class="flex justify-between items-center gap-3">

        ${
          charge.type === "flat"
          ? `
            <input type="number"
              value="${charge.amount || 0}"
              class="text-right text-lg"
              onchange="updateAmount(${index}, this.value)">
          `
          : `
            <div class="text-xs text-gray-400">
              Base: ${getBaseValue(charge.type).toFixed(2)}
            </div>

            <input type="number"
              value="${charge.rate || 0}"
              class="text-right text-lg"
              onchange="updateRate(${index}, this.value)">
          `
        }

        <div class="text-right font-bold w-24">
          $${amount.toFixed(2)}
        </div>

      </div>
    `;

    container.appendChild(div);
  });
}

// ==========================
// UPDATE RATE / AMOUNT
// ==========================
function updateRate(index, value) {
  quote.charges[index].rate = Number(value) || 0;
  refresh();
}

function updateAmount(index, value) {
  quote.charges[index].amount = Number(value) || 0;
  refresh();
}

// ==========================
// ADD / REMOVE
// ==========================
function addCharge() {
  quote.charges.push({
    name: "New Charge",
    type: "flat",
    amount: 0
  });
  renderCharges();
}

function removeCharge(index) {
  quote.charges.splice(index, 1);
  refresh();
}

// ==========================
// TOTAL
// ==========================
function calculateTotal() {

  let total = 0;

  quote.charges.forEach(c => {
    total += calculateCharge(c);
  });

  document.getElementById("totalAmount").innerText =
    "$" + total.toFixed(2);
}

// ==========================
// REFRESH
// ==========================
function refresh() {
  renderCharges();
  calculateTotal();
}

// ==========================
// ACTIONS
// ==========================
function generatePDF() {
  console.log("Generate PDF with:", quote);
}

function sendQuote() {
  console.log("Sending:", quote);
}

// ==========================
loadQuote();

</script>

</body>
</html>
