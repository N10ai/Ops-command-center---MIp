<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MIP Command Center</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.tailwindcss.com"></script>

<!-- APP-LIKE SETTINGS -->
<meta name="theme-color" content="#05070d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MIP">

<style>
body {
  background: radial-gradient(circle at top, #0b1220, #05070d);
  color: #e5e7eb;
}

/* GLASS */
.glass {
  background: rgba(255,255,255,0.04);
  backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px;
}

/* GLOW */
.glow {
  box-shadow: 0 0 20px rgba(59,130,246,0.25);
}

/* MENU */
.menu-btn {
  width:100%;
  text-align:left;
  padding:10px;
  border-radius:10px;
  color:#9ca3af;
}

.menu-btn:hover {
  background: rgba(255,255,255,0.05);
}

.menu-btn.active {
  background: rgba(59,130,246,0.15);
  color: #3b82f6;
}

/* MOBILE NAV */
.mobile-nav button.active {
  color:#3b82f6;
  font-weight:600;
}
</style>
</head>

<body class="font-sans bg-[#05070d] min-h-screen">

<div class="flex min-h-screen overflow-hidden">

  <!-- SIDEBAR (DESKTOP) -->
  <div class="hidden md:flex w-64 p-4 flex-col glass">

    <h1 class="text-lg font-semibold mb-6 text-white">MIP</h1>

    <button onclick="openPage('dashboard', this)" class="menu-btn active">Dashboard</button>
    <button onclick="openPage('operations', this)" class="menu-btn">Operations</button>
    <button onclick="openPage('alerts', this)" class="menu-btn">Alerts</button>
    <button onclick="openPage('kpis', this)" class="menu-btn">KPIs</button>
    <button onclick="openPage('clients', this)" class="menu-btn">Clients</button>
    <button onclick="openPage('tasks', this)" class="menu-btn">Tasks</button>
    <button onclick="openPage('billing', this)" class="menu-btn">Billing</button>
    <button onclick="openPage('employees', this)" class="menu-btn">Employees</button>
    <button onclick="openPage('quotes', this)" class="menu-btn">Quotes</button>

  </div>

  <!-- MAIN -->
  <div class="flex-1 flex flex-col overflow-hidden">

    <!-- MOBILE TOP BAR -->
    <div class="md:hidden fixed top-0 left-0 right-0 z-50 px-4 pt-6 pb-3 
    glass backdrop-blur-xl border-b border-white/10">

      <div class="flex justify-between items-center">
        <h1 class="text-white font-semibold">MIP</h1>
        <span class="text-sm text-gray-400">Dashboard</span>
      </div>

    </div>

    <!-- CONTENT -->
    <div class="flex-1 overflow-auto pt-24 pb-28 p-4 md:p-6 space-y-6">

      <!-- DASHBOARD -->
      <div id="dashboard" class="page">

        <h2 class="text-xl font-semibold mb-4 text-white">Overview</h2>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">

          <div class="glass glow p-4">
            <p class="text-xs text-gray-400">Orders</p>
            <h3 class="text-2xl font-semibold text-white">24</h3>
          </div>

          <div class="glass glow p-4">
            <p class="text-xs text-gray-400">Shipments</p>
            <h3 class="text-2xl font-semibold text-white">8</h3>
          </div>

          <div class="glass glow p-4">
            <p class="text-xs text-gray-400">Issues</p>
            <h3 class="text-2xl font-semibold text-red-400">3</h3>
          </div>

          <div class="glass glow p-4">
            <p class="text-xs text-gray-400">Revenue</p>
            <h3 class="text-2xl font-semibold text-white">$4,200</h3>
          </div>

        </div>

      </div>

      <!-- OPERATIONS -->
      <div id="operations" class="page hidden">

        <h2 class="text-xl font-semibold mb-4 text-white">Operations</h2>

        <div class="glass p-4 overflow-auto">
          <table class="w-full text-sm text-gray-300">
            <thead class="text-gray-400">
              <tr>
                <th class="text-left">Client</th>
                <th>Status</th>
                <th>Type</th>
                <th>Time</th>
              </tr>
            </thead>
            <tbody>
              <tr class="border-t border-gray-700">
                <td>Finesse Decor</td>
                <td class="text-blue-400">Processing</td>
                <td>Outbound</td>
                <td>10:30 AM</td>
              </tr>
            </tbody>
          </table>
        </div>

      </div>

      <!-- ALERTS -->
      <div id="alerts" class="page hidden">

        <h2 class="text-xl font-semibold mb-4 text-white">Alerts</h2>

        <div class="space-y-3">
          <div class="glass p-3 text-orange-400 glow">⚠ Missing inventory</div>
          <div class="glass p-3 text-orange-400 glow">⚠ Shipment delay</div>
        </div>

      </div>

      <!-- KPIS -->
      <div id="kpis" class="page hidden">

        <h2 class="text-xl font-semibold mb-4 text-white">KPIs</h2>

        <div class="grid grid-cols-2 md:grid-cols-3 gap-4">

          <div class="glass p-4 glow">
            <p class="text-xs text-gray-400">Receiving</p>
            <h3 class="text-xl text-white">1h</h3>
          </div>

          <div class="glass p-4 glow">
            <p class="text-xs text-gray-400">Orders</p>
            <h3 class="text-xl text-white">24</h3>
          </div>

          <div class="glass p-4 glow">
            <p class="text-xs text-gray-400">Errors</p>
            <h3 class="text-xl text-red-400">3</h3>
          </div>

        </div>

      </div>

    </div>

    <!-- MOBILE FLOATING NAV -->
    <div class="md:hidden mobile-nav fixed bottom-4 left-1/2 -translate-x-1/2 z-50 
    w-[92%] rounded-2xl glass backdrop-blur-xl border border-white/10 
    grid grid-cols-4 text-xs text-center py-3">

      <button onclick="openPage('dashboard', this)" class="active">Dashboard</button>
      <button onclick="openPage('operations', this)">Ops</button>
      <button onclick="openPage('alerts', this)">Alerts</button>
      <button onclick="openPage('kpis', this)">KPIs</button>

    </div>

  </div>
</div>

<script>
function openPage(page, el) {
  document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
  document.getElementById(page).classList.remove('hidden');

  document.querySelectorAll('.menu-btn, .mobile-nav button').forEach(btn => btn.classList.remove('active'));
  if(el) el.classList.add('active');
}
</script>

</body>
</html>
